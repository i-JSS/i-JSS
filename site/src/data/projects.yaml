  - id: "6a179330a55f0067628b3b06"
    title: "Logic Thinkering - Arquitetura de Software"
    category: academic
    description: >
      Mod para Minecraft desenvolvido com Fabric que adiciona minérios reforçados, ferramentas,
      armaduras e blocos de lógica redstone customizados. O projeto foi usado como terreno prático
      para aplicar padrões de projeto GoF (Factory Method, Strategy, Observer, Singleton),
      princípios SOLID e modelagem UML como contrato arquitetural. A stack Java + Kotlin foi uma
      decisão consciente: Kotlin para null-safety e menos boilerplate, Java para compatibilidade
      com a API do Fabric.
    stack:
      - Java
      - Kotlin
      - Fabric
      - LibGui
      - Gradle
    repository: "https://github.com/i-JSS/Logic-Thinkering"
    start: "2024-11-05"
    end: "2026-01-06"
    learnings:
      - "Modelagem orientada a objetos com UML: diagramas de classes, sequência, estados e componentes"
      - "Aplicação de princípios SOLID (SRP, OCP, DIP) no design de entidades e hierarquias de domínio"
      - "Implementação de GoFs criacionais (Factory Method), estruturais (Composite) e comportamentais (Strategy, Observer, Singleton)"
      - "Decisão arquitetural de interoperabilidade Java/Kotlin na JVM com foco em null-safety e redução de boilerplate"
      - "Gerenciamento de dependências e build pipeline com Gradle em projeto multi-source JVM"
