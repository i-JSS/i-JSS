  - id: "6a13349c508acd6a99d5c644"
    title: "Mortal Kombat GCES – Pipeline CI/CD"
    category: academic
    description: >
      Pipeline completo de DevOps sobre um jogo de luta browser-based com backend em Node.js/Express
      e frontend em HTML5 Canvas. Engloba containerização com Docker em ambientes dev e prod,
      orquestração via Docker Compose com PostgreSQL, reverse proxy SSL via NGINX e pipeline CI/CD
      no GitLab com build, testes unitários, lint e deploy contínuo.
    stack:
      - Node.js
      - Docker
      - PostgreSQL
      - NGINX
      - GitLab CI/CD
    repository: "https://github.com/i-JSS/Mortal-Kombat-GCES"
    start: "2025-10-30"
    end: "2025-11-06"
    learnings:
      - Containerização de aplicações full-stack com Docker em ambientes de desenvolvimento e produção
      - Orquestração de múltiplos serviços com Docker Compose
      - Configuração de reverse proxy e SSL com NGINX
      - Implementação de pipeline CI/CD no GitLab com build, testes e lint automatizados
      - Deploy contínuo com publicação de imagens no Container Registry do GitLab
      - Integração de banco de dados PostgreSQL em ambiente containerizado
      - Boas práticas de DevOps com commits atômicos e entregas incrementais
    role: "Desenvolvedor"
    duration: "20 horas"
    image: "mk_gces.png"

